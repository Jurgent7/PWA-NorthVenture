<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NorthVenture Valbona Map — 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16302B">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NorthVenture">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    overflow: hidden;           /* the page itself never scrolls */
    overscroll-behavior: none;  /* stop iOS/Android rubber-band & pull-to-refresh from grabbing the drag */
    touch-action: none;         /* don't let the browser interpret touches on this page as page gestures */
    position: fixed;            /* belt-and-braces: pins the document so it can't be dragged at all */
  }
  #app-root { position: relative; width: 100%; height: 100vh; }
  #map { width: 100%; height: 100vh; touch-action: none; }
  #app-root.is-fullscreen, #app-root:fullscreen { width: 100vw; height: 100vh; }
  #btn-exit-fullscreen {
    display: none;
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    background: rgba(0,0,0,0.72);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    touch-action: manipulation;
  }
  #btn-exit-fullscreen:active { background: rgba(0,0,0,0.85); }
  #app-root.is-fullscreen #btn-exit-fullscreen { display: flex; }

  .legend {
    background: white;
    padding: 10px 14px;
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    font-size: 13px;
    line-height: 1.5;
    max-height: 80vh;
    max-width: 100%;
    overflow-y: auto;
    touch-action: pan-y; /* let this panel scroll normally even though the page/map disable touch gestures */
    box-sizing: border-box;
  }
  .legend h4 { margin: 0 0 6px 0; font-size: 14px; }
  .legend span.dot, .track-swatch {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 6px;
  }

  /* Corner stacks: each corner is a flex column so its contents
     reflow automatically (panels collapsing/expanding, long track
     lists, etc.) instead of relying on fixed pixel offsets that
     can overlap. */
  .corner {
    position: absolute;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: calc(100vh - 24px);
  }
  .corner > .legend, .corner > .btn-bar { flex: 0 0 auto; max-width: 78vw; }
  #corner-tl { top: 12px; left: 12px; align-items: flex-start; }
  #corner-tr { top: 12px; right: 12px; align-items: flex-end; }
  #corner-bl { bottom: 12px; left: 12px; align-items: flex-start; flex-direction: column-reverse; }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .panel-header h4 { margin: 0; }
  .panel-toggle-btn {
    flex: 0 0 auto; width: 24px; height: 24px; border: none; border-radius: 5px;
    background: #edf2f7; color: #2d3748; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .panel-toggle-btn:active { background: #e2e8f0; }
  .panel-body { margin-top: 8px; max-height: 60vh; overflow-y: auto; }
  .legend.collapsed .panel-body { display: none; }
  .panel-toggle-btn .icon-open { display: inline; }
  .panel-toggle-btn .icon-closed { display: none; }
  .legend.collapsed .panel-toggle-btn .icon-open { display: none; }
  .legend.collapsed .panel-toggle-btn .icon-closed { display: inline; }

  .base-row, .track-row {
    display: flex; align-items: center; margin-bottom: 4px; cursor: pointer; padding: 3px 4px; border-radius: 5px;
  }
  .base-row:hover, .track-row:hover { background: #f7fafc; }
  .base-row.active { background: #ebf4ff; font-weight: 600; }
  .track-label { flex: 1; }
  .track-stats { color: #888; font-size: 11px; }
  .gpx-download-btn {
    flex: 0 0 auto;
    width: 22px; height: 22px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background: white;
    color: #4a5568;
    font-size: 12px;
    cursor: pointer;
    margin-left: 6px;
  }
  .gpx-download-btn:hover { background: #ebf8ff; border-color: #4299e1; color: #2b6cb0; }
  .pdf-download-btn { width: auto; padding: 0 6px; font-size: 9px; font-weight: 700; }
  .pdf-download-btn:hover { background: #fff5f5; border-color: #c53030; color: #c53030; }
  .download-all-btn-pdf { border-color: #c53030; background: #fff5f5; color: #c53030; }
  .download-all-btn-pdf:hover { background: #fed7d7; }
  .download-all-btn {
    display: block;
    width: 100%;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 0;
    margin-bottom: 8px;
    border: 1px solid #4299e1;
    border-radius: 6px;
    background: #ebf8ff;
    color: #2b6cb0;
    cursor: pointer;
  }
  .download-all-btn:hover { background: #bee3f8; }
  .diff-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 8px;
    margin-right: 5px;
  }
  .diff-filter-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #eee;
  }
  .diff-filter-btn {
    flex: 1;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: transparent;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .diff-filter-btn:hover {
    opacity: 0.8;
  }
  .popup-photo {
    display: block;
    width: 100%;
    max-width: 260px;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .popup-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .popup-photo { width: 100%; max-width: 220px; height: 130px; object-fit: cover; border-radius: 6px; margin-bottom: 6px; display: block; }
  .popup-elev { color: #555; font-size: 12px; margin-bottom: 4px; }
  .popup-desc { font-size: 13px; margin-bottom: 6px; }
  .popup-confidence {
    display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 10px; font-weight: 600;
  }
  .conf-confirmed { background: #c6f6d5; color: #22543d; }
  .conf-best-guess { background: #feebc8; color: #7b341e; }
  .conf-unidentified { background: #e2e8f0; color: #4a5568; }
  .directions-link { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 600; color: #2b6cb0; text-decoration: none; }
  .directions-link:hover { text-decoration: underline; }

  /* --- Custom endpoint / waypoint marker DOM elements --- */
  .endpoint-marker {
    width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .wp-marker { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
  .service-marker {
    width: 24px; height: 24px; border-radius: 6px; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer;
  }
  .user-marker { width: 16px; height: 16px; border-radius: 50%; background: #4285f4; border: 2px solid #fff; box-shadow: 0 0 0 4px rgba(66,133,244,0.3); }

  /* --- Floating button bar (nav / tilt controls) --- */
  .btn-bar {
    display: flex; flex-direction: column; gap: 4px;
    background: white; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.3); padding: 4px;
    touch-action: manipulation;
  }
  .nav-btn {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #2d3748; background: white; border-radius: 5px; border: none;
  }
  .nav-btn:active { background: #f0f0f0; }
  .nav-btn-loading svg { animation: nav-spin 0.9s linear infinite; }
  @keyframes nav-spin { to { transform: rotate(360deg); } }
  .btn-sep { height: 1px; background: #e2e8f0; margin: 2px 4px; }

  .fullscreen-btn { font-size: 16px; }
  .fullscreen-btn:active { background: #f0f0f0; }
  .fs-icon-exit { display: none; }
  #app-root.is-fullscreen .fs-icon-enter { display: none; }
  #app-root.is-fullscreen .fs-icon-exit { display: inline; }

  .pitch-readout {
    position: absolute; z-index: 5; bottom: 12px; right: 12px;
    background: white; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    padding: 6px 10px; font-size: 11px; color: #4a5568;
  }

  @media (max-width: 640px) {
    .legend { padding: 8px 10px; font-size: 12.5px; max-width: 60vw; max-height: 50vh; }
    .corner > .legend { max-width: 60vw; }
  }

  /* --- Place search control --- */
  .search-control {
    background: white;
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    width: 220px;
    max-width: 78vw;
    touch-action: pan-y;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
  }
  .search-box svg { flex: 0 0 auto; color: #718096; }
  .search-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    min-width: 0;
    font-family: inherit;
  }
  .search-clear-btn {
    flex: 0 0 auto;
    border: none;
    background: none;
    color: #a0aec0;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: none;
    padding: 2px 3px;
  }
  .search-control.has-text .search-clear-btn { display: block; }
  .search-results {
    max-height: 200px;
    overflow-y: auto;
    border-top: 1px solid #edf2f7;
    display: none;
  }
  .search-control.show-results .search-results { display: block; }
  .search-result-row {
    padding: 7px 10px;
    font-size: 11.5px;
    line-height: 1.3;
    cursor: pointer;
    border-bottom: 1px solid #f7fafc;
  }
  .search-result-row:last-child { border-bottom: none; }
  .search-result-row:hover, .search-result-row.highlighted { background: #ebf8ff; }
  .search-result-main { font-weight: 600; color: #2d3748; }
  .search-result-sub { color: #a0aec0; font-size: 10px; margin-top: 1px; }
  .search-status { padding: 7px 10px; font-size: 11px; color: #a0aec0; }
</style>
</head>
<body>

<div id="app-root">
<button type="button" id="btn-exit-fullscreen" title="Exit fullscreen">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  Exit Fullscreen
</button>
<div id="map"></div>

<!-- Top-left: search box + base layer switcher + locate/reset controls -->
<div id="corner-tl" class="corner">
  <!-- Place / address search -->
  <div id="search-control" class="search-control">
    <div class="search-box">

        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search places" autocomplete="off">
      <button type="button" id="search-clear-btn" class="search-clear-btn" title="Clear">&#10005;</button>

    <div id="search-results" class="search-results"></div>

  <!-- Zoom + Locate + Reset -->

    <button type="button" class="nav-btn" id="btn-open-new-tab" title="Open full map in a new tab">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>

    </div>
    <div style="margin-top:2px;">
      <span style="display:inline-flex;align-items:center;justify-content:center;background:#c53030;color:#fff;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:700;margin-right:6px;">E</span>Trail end

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  // Estimate hiking duration and difficulty from distance + elevation range.
  // Ascent is approximated as (max_ele - min_ele) since we only have the
  // simplified track's elevation range, not a full point-by-point profile —
  // a reasonable proxy for these point-to-point / out-and-back routes, but
  // still an estimate rather than a measured cumulative-ascent figure.
  function estimateHike(t) {
    const ascent = Math.max(0, t.max_ele - t.min_ele);
    const hours = t.length_km / 5 + ascent / 600; // Naismith's rule
    const minutes = Math.max(15, Math.round((hours * 60) / 15) * 15);
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    const duration = h > 0 ? (m > 0 ? `${h}h ${m}m` : `${h}h`) : `${m}m`;

    let difficulty, color;
    if (t.length_km <= 5 && ascent <= 300) {
      difficulty = "Easy"; color = "#2f855a";
    } else if (t.length_km <= 12 && ascent <= 900) {
      difficulty = "Moderate"; color = "#c05621";
    } else {
      difficulty = "Hard"; color = "#c53030";
    }
    return { duration, difficulty, color };
  }

  // Photo lookup for track start/end popups — key is "<trackId>_start" or "<trackId>_end".

      { id: "satellite", type: "raster", source: "satellite", layout: { visibility: "none" } },
      { id: "satelliteLabels", type: "raster", source: "satelliteLabels", layout: { visibility: "none" } },
      { id: "light", type: "raster", source: "light", layout: { visibility: "none" } }
    ],
    terrain: { source: "terrainSource", exaggeration: 1.2 },
    sky: {
      "sky-color": "#88c1e8",
      "sky-horizon-blend": 0.5,
      "horizon-color": "#e8f0f5",
      "horizon-fog-blend": 0.5,
      "fog-color": "#d9e5ea",
      "fog-ground-blend": 0.3
    }
  };

  // ---- Initial camera: compute bounds of the main track, start with a tilt ----
  function boundsOf(coords) {
    let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
    coords.forEach(([lat, lng]) => {
      if (lat < minLat) minLat = lat;
      if (lat > maxLat) maxLat = lat;
      if (lng < minLng) minLng = lng;
      if (lng > maxLng) maxLng = lng;
    });
    return [[minLng, minLat], [maxLng, maxLat]];
  }
  const mainTrack = tracks.find(t => t.id === mainTrackId);
  const initialBounds = boundsOf(mainTrack.coords);

  // Cap how far the map can tilt. Raster tiles draped over 3D terrain get
  // dramatically more expensive to render past ~65-70°, because the camera's
  // view frustum reaches much further toward the horizon and pulls in far
  // more tiles (both imagery and elevation) than a moderate tilt does — this
  // is the single biggest cause of rotate/tilt jank in a raster+terrain setup.
  const MAX_PITCH = 68;

  // Cap the render resolution. On high-DPI/retina screens (devicePixelRatio
  // 2-3), MapLibre renders at that many times the pixel count by default —
  // which multiplies GPU cost for every terrain-draped tile on every frame
  // of a rotate/tilt drag. Capping it (and see the adaptive scaling below)
  // is usually the single highest-impact fix for this kind of lag.
  const fullPixelRatio = window.devicePixelRatio || 1;
  const initialPixelRatio = Math.min(fullPixelRatio, 2);

  const map = new maplibregl.Map({
    container: "map",
    style: style,
    center: [19.83, 42.41],
    zoom: 11,
    pitch: 55,
    bearing: -10,
    maxPitch: MAX_PITCH,
    pixelRatio: initialPixelRatio,
    fadeDuration: 0, // skip the raster cross-fade animation; fewer blended draw calls while tiles stream in during a drag
    attributionControl: { compact: true }
  });

  // --- Adaptive resolution: render at a lower pixel ratio *while* the user is
  // actively rotating/tilting/panning, then snap back to full resolution once
  // they let go. The map looks identical when still; it only trades a bit of
  // sharpness for smoothness during the drag itself, which is when lag is felt.
  if (typeof map.setPixelRatio === "function") {
    const dragPixelRatio = Math.min(fullPixelRatio, 1);
    let resLowered = false;
    const lowerRes = () => {
      if (!resLowered) { map.setPixelRatio(dragPixelRatio); resLowered = true; }
    };
    const restoreRes = () => {
      if (resLowered) { map.setPixelRatio(initialPixelRatio); resLowered = false; }
    };
    map.on("rotatestart", lowerRes);
    map.on("pitchstart", lowerRes);
    map.on("dragstart", lowerRes);
    map.on("rotateend", restoreRes);
    map.on("pitchend", restoreRes);
    map.on("dragend", restoreRes);
  }

  let initialCamera = null;

  map.on("load", () => {
    map.fitBounds(initialBounds, { padding: 60, pitch: 55, bearing: -10, duration: 0 });
    // Snapshot the resulting camera so "Reset view" can return to it later
    setTimeout(() => {
      initialCamera = { center: map.getCenter(), zoom: map.getZoom(), pitch: map.getPitch(), bearing: map.getBearing() };
    }, 300);

    addTracks();
    addWaypoints();
    addServices();
  });

  // Throttle the pitch/bearing readout: 'pitch' and 'rotate' fire on every
  // single animation frame during a drag, so writing to the DOM on every one
  // of them adds unnecessary work right when the renderer is already busiest.
  let readoutPending = false;
  function updatePitchReadout() {
    if (readoutPending) return;
    readoutPending = true;
    requestAnimationFrame(() => {
      const el = document.getElementById("pitch-readout");
      el.textContent = `Pitch ${Math.round(map.getPitch())}° · Bearing ${Math.round(map.getBearing())}°`;
      readoutPending = false;
    });
  }
  map.on("pitch", updatePitchReadout);
  map.on("rotate", updatePitchReadout);

  // ---- Base layer switcher ----
  const baseLayerGroups = {
    topo: ["topo"],
    satellite: ["satellite", "satelliteLabels"],
    street: ["street"],
    light: ["light"]
  };
  const baseLabels = { topo: "Topographic", satellite: "Satellite", street: "Street", light: "Light / Minimal" };
  let activeBase = "topo";

  function renderBasePanel() {
    const body = document.getElementById("base-panel-body");
    body.innerHTML = "";
    Object.keys(baseLayerGroups).forEach(key => {
      const row = document.createElement("div");
      row.className = "base-row" + (key === activeBase ? " active" : "");
      row.textContent = baseLabels[key];
      row.addEventListener("click", () => setBaseLayer(key));
      body.appendChild(row);
    });
  }
  function setBaseLayer(name) {
    activeBase = name;
    Object.entries(baseLayerGroups).forEach(([key, ids]) => {
      ids.forEach(id => map.setLayoutProperty(id, "visibility", key === name ? "visible" : "none"));
    });
    renderBasePanel();
  }
  renderBasePanel();

  // ---- Tracks: GeoJSON line layers + start/end markers ----
  const trackMarkers = {};

  function addTracks() {
    tracks.forEach(t => {
      const lineCoords = t.coords.map(([lat, lng]) => [lng, lat]);
      map.addSource("track-" + t.id, {
        type: "geojson",
        data: { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: lineCoords } }
      });
      map.addLayer({
        id: "track-line-" + t.id,
        type: "line",
        source: "track-" + t.id,
        layout: { visibility: "none", "line-cap": "round", "line-join": "round" },
        paint: {
          "line-color": t.color,
          "line-width": t.id === mainTrackId ? 5 : 4,
          "line-opacity": 0.9,
          ...(t.confidence === "unverified" ? { "line-dasharray": [2, 2] } : {})
        }
      });

      const hikeInfo = estimateHike(t);
      const unverifiedNote = t.confidence === "unverified"
        ? `<div class="popup-desc" style="color:#c05621; font-weight:600; margin-top:6px;">⚠ Estimated route — not a traced GPS track. Actual trail path and distance will differ.</div>`
        : "";
      const popupHtml = `
        <div class="popup-title">${t.name}</div>
        <div class="popup-elev" style="margin-top:6px;">
          <span class="diff-badge" style="background:${hikeInfo.color}22; color:${hikeInfo.color};">${hikeInfo.difficulty}</span>
          ~${hikeInfo.duration} &middot; ${t.length_km} km &middot; ${t.min_ele}–${t.max_ele} m elevation
        </div>
        ${unverifiedNote}
      `;
      map.on("click", "track-line-" + t.id, (e) => {
        new maplibregl.Popup().setLngLat(e.lngLat).setHTML(popupHtml).addTo(map);
      });
      map.on("mouseenter", "track-line-" + t.id, () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "track-line-" + t.id, () => { map.getCanvas().style.cursor = ""; });

      const startPt = lineCoords[0];
      const endPt = lineCoords[lineCoords.length - 1];
      const photoHtml = (key) =>
        endpointPhotos[key] ? `<img src="${endpointPhotos[key]}" alt="" class="popup-photo">` : "";

      const startEl = document.createElement("div");
      startEl.className = "endpoint-marker";
      startEl.style.background = "#2f855a";
      startEl.textContent = "S";
      const startMarker = new maplibregl.Marker({ element: startEl })
        .setLngLat(startPt)
        .setPopup(new maplibregl.Popup().setHTML(`${photoHtml(t.id + "_start")}<div class="popup-title">${t.name} — Start</div>${popupHtml}`));

      const endEl = document.createElement("div");
      endEl.className = "endpoint-marker";
      endEl.style.background = "#c53030";
      endEl.textContent = "E";
      const endMarker = new maplibregl.Marker({ element: endEl })
        .setLngLat(endPt)
        .setPopup(new maplibregl.Popup().setHTML(`${photoHtml(t.id + "_end")}<div class="popup-title">${t.name} — End</div>${popupHtml}`));

      // No track's markers are added by default \u2014 the map opens with
      // every trail unticked; markers appear only once a trail is toggled on.
      trackMarkers[t.id] = { start: startMarker, end: endMarker };
    });
    renderTrackPanel();
  }

  function setTrackVisible(id, visible) {
    map.setLayoutProperty("track-line-" + id, "visibility", visible ? "visible" : "none");
    const m = trackMarkers[id];
    if (visible) { m.start.addTo(map); m.end.addTo(map); }
    else { m.start.remove(); m.end.remove(); }
  }

  const activeDifficulties = new Set(["Easy", "Moderate", "Hard"]);
  const DIFF_COLORS = {
    "Easy": { color: "#2f855a" },
    "Moderate": { color: "#c05621" },
    "Hard": { color: "#c53030" }
  };

  // ---- GPX export ----
  function xmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function trackToGPXBlock(t) {
    const pts = t.coords.map(([lat, lon]) => `      <trkpt lat="${lat}" lon="${lon}"></trkpt>`).join("\n");
    return `  <trk>\n    <name>${xmlEscape(t.name)}</name>\n    <trkseg>\n${pts}\n    </trkseg>\n  </trk>`;
  }
  function gpxHeader() {
    return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="NorthVenture Trail Ventures" xmlns="http://www.topografix.com/GPX/1/1">\n`;
  }
  function triggerDownload(filename, content) {
    const blob = new Blob([content], { type: "application/gpx+xml" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function downloadTrackGPX(t) {
    const xml = gpxHeader() + trackToGPXBlock(t) + "\n</gpx>\n";
    const safeName = t.name.replace(/[^\w\-]+/g, "_").replace(/^_+|_+$/g, "");
    triggerDownload(`NorthVenture_${safeName}.gpx`, xml);
  }
  function downloadAllTracksGPX() {
    const xml = gpxHeader() + tracks.map(trackToGPXBlock).join("\n") + "\n</gpx>\n";
    triggerDownload("NorthVenture_Valbona_AllTrails.gpx", xml);
  }

  // ---- PDF trail card export ----
  // jsPDF's built-in fonts only support the WinAnsi/CP1252 character set \u2014
  // characters outside that (like \u2192 or \u25CF) render as garbled symbols
  // instead of the intended glyph. Swap them for safe equivalents before
  // anything reaches doc.text().
  function pdfSafeText(s) {
    return String(s).replace(/\u2192/g, "-");
  }

  function hexToRgb(hex) {
    const v = hex.replace("#", "");
    return [parseInt(v.substr(0, 2), 16), parseInt(v.substr(2, 2), 16), parseInt(v.substr(4, 2), 16)];
  }

  const PDF_LOGO_ASPECT = 4.4304; // width / height

  // Figures out sensible place names for a trail's start/end points:
  // 1) nearest known waypoint, if close enough; 2) parsed from the trail
  // name itself (e.g. "Valbon\u00eb \u2192 Theth Crossing" or "Cerem to Kollata e Mire");
  // 3) generic "Start"/"End" as a last resort.
  function nearestWaypointName(lat, lon, maxKm) {
    let best = null, bestDist = Infinity;
    waypoints.forEach(w => {
      const dLat = (w.coords[0] - lat) * 111;
      const dLon = (w.coords[1] - lon) * 111 * Math.cos(lat * Math.PI / 180);
      const dist = Math.sqrt(dLat * dLat + dLon * dLon);
      if (dist < bestDist) { bestDist = dist; best = w.name; }
    });
    return bestDist <= maxKm ? best : null;
  }
  function parseNameEndpoints(name) {
    if (name.includes("\u2192")) {
      const parts = name.split("\u2192").map(s => s.trim());
      return [parts[0], parts[1]];
    }
    const toMatch = name.match(/^(.*?)\s+to\s+(.*)$/i);
    if (toMatch) return [toMatch[1].trim(), toMatch[2].trim()];
    return [null, null];
  }
  function getEndpointLabels(t) {
    const [nameStart, nameEnd] = parseNameEndpoints(t.name);
    const startCoord = t.coords[0];
    const endCoord = t.coords[t.coords.length - 1];
    const wpStart = nearestWaypointName(startCoord[0], startCoord[1], 0.6);
    const wpEnd = nearestWaypointName(endCoord[0], endCoord[1], 0.6);
    return {
      start: wpStart || nameStart || "Start",
      end: wpEnd || nameEnd || "End"
    };
  }

  function drawTrailCardPDF(doc, t, terrainDataUrl) {
    const hike = estimateHike(t);
    const pageW = 148, pageH = 210; // A5 portrait, mm

    doc.setFillColor(247, 241, 227);
    doc.rect(0, 0, pageW, pageH, "F");

    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.setTextColor(120, 113, 96);
    doc.text("NORTHVENTURE PDF MAP", 15, 16);

    // Logo, top-right
    const logoW = 32;
    const logoH = logoW / PDF_LOGO_ASPECT;
    doc.addImage(PDF_LOGO, "PNG", pageW - 15 - logoW, 8, logoW, logoH);

    doc.setFontSize(18);
    doc.setTextColor(30, 27, 22);
    const nameLines = doc.splitTextToSize(pdfSafeText(t.name), pageW - 30);
    doc.text(nameLines, 15, 27);
    let y = 27 + nameLines.length * 7 + 5;

    doc.setDrawColor(30, 27, 22);
    doc.setLineWidth(0.4);
    doc.line(15, y, pageW - 15, y);
    y += 8;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(60, 55, 48);
    doc.text(`Distance: ${t.length_km} km`, 15, y); y += 6;
    doc.text(`Elevation: ${t.min_ele}\u2013${t.max_ele} m`, 15, y); y += 6;
    doc.text(`Estimated time: ~${hike.duration}`, 15, y); y += 9;

    const dc = PDF_DIFF_COLOR[hike.difficulty];
    doc.setFillColor(dc[0], dc[1], dc[2]);
    doc.roundedRect(15, y - 5, 30, 8, 2, 2, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(9);
    doc.setFont("helvetica", "bold");
    doc.text(hike.difficulty, 30, y - 0.3, { align: "center" });
    y += 12;

    // Trail shape / terrain box
    const boxX = 15, boxY = y, boxW = pageW - 30, boxH = 95;
    doc.setDrawColor(201, 191, 160);
    doc.setLineWidth(0.3);

    const lats = t.coords.map(c => c[0]);
    const lons = t.coords.map(c => c[1]);
    const lat0 = (Math.min(...lats) + Math.max(...lats)) / 2;
    const cosLat = Math.cos(lat0 * Math.PI / 180);
    const xs = lons.map(lon => lon * cosLat);
    const ys = lats;
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const yMin = Math.min(...ys), yMax = Math.max(...ys);
    const dataW = Math.max(xMax - xMin, 0.0001);
    const dataH = Math.max(yMax - yMin, 0.0001);
    const pad = 6;
    const scale = Math.min((boxW - 2 * pad) / dataW, (boxH - 2 * pad) / dataH);
    const offX = ((boxW - 2 * pad) - dataW * scale) / 2;
    const offY = ((boxH - 2 * pad) - dataH * scale) / 2;
    const drawX = x => boxX + pad + (x - xMin) * scale + offX;
    const drawY = yv => boxY + boxH - pad - (yv - yMin) * scale - offY;

    if (terrainDataUrl) {
      // Real topographic terrain, captured live \u2014 the trail line and start/end
      // markers are already rendered into this image by the map itself
      // (not recomputed separately), so they're guaranteed to line up
      // correctly with the terrain \u2014 nothing extra to draw here.
      doc.addImage(terrainDataUrl, "PNG", boxX, boxY, boxW, boxH);
    } else {
      // No photo \u2014 draw the schematic vector line ourselves
      const rgb = hexToRgb(t.color);
      doc.setDrawColor(rgb[0], rgb[1], rgb[2]);
      doc.setLineWidth(0.7);
      doc.setLineCap("round");
      doc.setLineJoin("round");
      for (let i = 1; i < xs.length; i++) {
        doc.line(drawX(xs[i - 1]), drawY(ys[i - 1]), drawX(xs[i]), drawY(ys[i]));
      }
      const startPt = [drawX(xs[0]), drawY(ys[0])];
      const endPt = [drawX(xs[xs.length - 1]), drawY(ys[ys.length - 1])];
      doc.setFillColor(47, 133, 90);
      doc.circle(startPt[0], startPt[1], 1.8, "F");
      doc.setFillColor(197, 48, 48);
      doc.circle(endPt[0], endPt[1], 1.8, "F");

      const labels = getEndpointLabels(t);
      const labelBox = (px, py, text, above) => {
        doc.setFontSize(7.5);
        doc.setFont("helvetica", "bold");
        const tw = doc.getTextWidth(text);
        const lx = Math.min(Math.max(px - tw / 2, boxX + 2), boxX + boxW - tw - 2);
        const ly = above ? Math.max(py - 4, boxY + 6) : Math.min(py + 7, boxY + boxH - 2);
        doc.setFillColor(247, 241, 227);
        doc.setDrawColor(220, 210, 185);
        doc.setLineWidth(0.2);
        doc.roundedRect(lx - 1.5, ly - 3.6, tw + 3, 4.8, 1, 1, "FD");
        doc.setTextColor(40, 36, 30);
        doc.text(text, lx, ly);
      };
      labelBox(startPt[0], startPt[1], pdfSafeText(labels.start), true);
      labelBox(endPt[0], endPt[1], pdfSafeText(labels.end), false);
    }
    doc.rect(boxX, boxY, boxW, boxH);

    // Start / end place-name caption (below the box, so it never depends on
    // pixel-precise alignment with whatever's inside the box above)
    const labels2 = getEndpointLabels(t);
    const startLabel = pdfSafeText(labels2.start);
    const endLabel = pdfSafeText(labels2.end);
    const captionY = boxY + boxH + 5.5;
    doc.setFontSize(8);
    doc.setFont("helvetica", "bold");

    doc.setFillColor(47, 133, 90);
    doc.circle(boxX + 1.2, captionY - 1.2, 1.2, "F");
    doc.setTextColor(40, 36, 30);
    doc.text(startLabel, boxX + 4.5, captionY);

    const endTextWidth = doc.getTextWidth(endLabel);
    const endLabelX = boxX + boxW - endTextWidth - 4.5;
    doc.setFillColor(197, 48, 48);
    doc.circle(endLabelX - 3.3, captionY - 1.2, 1.2, "F");
    doc.setTextColor(40, 36, 30);
    doc.text(endLabel, endLabelX, captionY);

    y = boxY + boxH + 12;
    doc.setFontSize(7.5);
    doc.setFont("helvetica", "italic");
    doc.setTextColor(140, 130, 110);
    doc.text(
      terrainDataUrl
        ? "Topographic terrain \u00b7 GPS-traced route. Green = start, red = end."
        : "Trail shape only, not to scale \u2014 GPS-traced route. Green = start, red = end.",
      15, y
    );

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.text("\u00a9 NorthVenture Trail Ventures \u2014 Valbon\u00eb, Albania", 15, pageH - 14);
    doc.text("Scan the interactive 3D map for live trail photos & weather.", 15, pageH - 9);
  }

  // Attempts to capture real topographic terrain for a trail using an isolated,
  // hidden MapLibre instance (never touching the main map's already-loaded
  // sources, to avoid any risk of tainting this one). Resolves to a PNG data
  // URL on success, or null if the tile server doesn't cooperate (CORS,
  // timeout, network failure) \u2014 callers must handle the null case by
  // falling back to the schematic trail-shape rendering.
  function captureTerrainSnapshot(t) {
    return new Promise((resolve) => {
      let settled = false;
      const finish = (result) => {
        if (settled) return;
        settled = true;
        try { tempMap.remove(); } catch (e) {}
        try { document.body.removeChild(hiddenDiv); } catch (e) {}
        resolve(result);
      };

      const hiddenDiv = document.createElement("div");
      hiddenDiv.style.cssText = "position:absolute; left:-9999px; top:0; width:800px; height:600px;";
      document.body.appendChild(hiddenDiv);

      let tempMap;
      try {
        tempMap = new maplibregl.Map({
          container: hiddenDiv,
          style: {
            version: 8,
            sources: {
              topo: {
                type: "raster",
                tiles: [
                  "https://a.tile.opentopomap.org/{z}/{x}/{y}.png",
                  "https://b.tile.opentopomap.org/{z}/{x}/{y}.png",
                  "https://c.tile.opentopomap.org/{z}/{x}/{y}.png"
                ],
                tileSize: 256
              }
            },
            layers: [{ id: "topo", type: "raster", source: "topo" }]
          },
          preserveDrawingBuffer: true,
          attributionControl: false,
          interactive: false
        });
      } catch (e) {
        finish(null);
        return;
      }

      const timeout = setTimeout(() => finish(null), 8000);

      tempMap.on("error", () => { clearTimeout(timeout); finish(null); });

      tempMap.on("load", () => {
        const lats = t.coords.map(c => c[0]);
        const lons = t.coords.map(c => c[1]);
        const bounds = [
          [Math.min(...lons), Math.min(...lats)],
          [Math.max(...lons), Math.max(...lats)]
        ];

        // Render the actual trail line + start/end points using the map
        // library's own layers (not a separately-computed overlay) so they
        // land in exactly the right spot relative to the imagery \u2014 both
        // are drawn by the same rendering engine, so there's no way for
        // them to drift apart the way two independent calculations could.
        const lineCoords = t.coords.map(c => [c[1], c[0]]);
        tempMap.addSource("trail-line-src", {
          type: "geojson",
          data: { type: "Feature", geometry: { type: "LineString", coordinates: lineCoords } }
        });
        tempMap.addLayer({
          id: "trail-line-layer",
          type: "line",
          source: "trail-line-src",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: { "line-color": "#ffffff", "line-width": 6, "line-opacity": 0.9 }
        });
        tempMap.addLayer({
          id: "trail-line-layer-fg",
          type: "line",
          source: "trail-line-src",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: { "line-color": t.color, "line-width": 3.5, "line-opacity": 1 }
        });
        tempMap.addSource("trail-endpoints-src", {
          type: "geojson",
          data: {
            type: "FeatureCollection",
            features: [
              { type: "Feature", properties: { role: "start" }, geometry: { type: "Point", coordinates: lineCoords[0] } },
              { type: "Feature", properties: { role: "end" }, geometry: { type: "Point", coordinates: lineCoords[lineCoords.length - 1] } }
            ]
          }
        });
        tempMap.addLayer({
          id: "trail-endpoints-layer",
          type: "circle",
          source: "trail-endpoints-src",
          paint: {
            "circle-radius": 6,
            "circle-color": ["match", ["get", "role"], "start", "#2f855a", "end", "#c53030", "#000000"],
            "circle-stroke-color": "#ffffff",
            "circle-stroke-width": 2
          }
        });

        tempMap.fitBounds(bounds, { padding: 30, animate: false });

        tempMap.once("idle", () => {
          clearTimeout(timeout);
          try {
            const dataUrl = tempMap.getCanvas().toDataURL("image/png");
            finish(dataUrl);
          } catch (e) {
            // Canvas tainted (no CORS) or another capture failure \u2014 fall back gracefully
            finish(null);
          }
        });
      });
    });
  }

  async function downloadTrackPDF(t) {
    const doc = new jspdf.jsPDF({ unit: "mm", format: "a5" });
    const terrain = await captureTerrainSnapshot(t);
    drawTrailCardPDF(doc, t, terrain);
    const safeName = t.name.replace(/[^\w\-]+/g, "_").replace(/^_+|_+$/g, "");
    doc.save(`NorthVenture_${safeName}.pdf`);
  }

  async function downloadAllTracksPDF() {
    const doc = new jspdf.jsPDF({ unit: "mm", format: "a5" });
    for (let i = 0; i < tracks.length; i++) {
      if (i > 0) doc.addPage();
      const terrain = await captureTerrainSnapshot(tracks[i]);
      drawTrailCardPDF(doc, tracks[i], terrain);
    }
    doc.save("NorthVenture_Valbona_AllTrails.pdf");
  }

  function renderTrackPanel() {
    const body = document.getElementById("track-panel-body");
    body.innerHTML = "";

    const filterBar = document.createElement("div");
    filterBar.className = "diff-filter-bar";
    ["Easy", "Moderate", "Hard"].forEach(level => {
      const info = DIFF_COLORS[level];
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "diff-filter-btn active";
      btn.textContent = level;
      btn.style.borderColor = info.color;
      btn.style.color = info.color;
      btn.style.background = info.color + "22";
      btn.addEventListener("click", () => {
        if (activeDifficulties.has(level)) {
          activeDifficulties.delete(level);
          btn.classList.remove("active");
          btn.style.background = "transparent";
          btn.style.color = "#999";
          btn.style.borderColor = "#ccc";
        } else {
          activeDifficulties.add(level);
          btn.classList.add("active");
          btn.style.background = info.color + "22";
          btn.style.color = info.color;
          btn.style.borderColor = info.color;
        }
        applyDifficultyFilter();
      });
      filterBar.appendChild(btn);
    });
    body.appendChild(filterBar);

    const downloadAllBtn = document.createElement("button");
    downloadAllBtn.type = "button";
    downloadAllBtn.className = "download-all-btn";
    downloadAllBtn.innerHTML = "&#8681; Download All Trails (GPX)";
    downloadAllBtn.addEventListener("click", downloadAllTracksGPX);
    body.appendChild(downloadAllBtn);

    const downloadAllPdfBtn = document.createElement("button");
    downloadAllPdfBtn.type = "button";
    downloadAllPdfBtn.className = "download-all-btn download-all-btn-pdf";
    downloadAllPdfBtn.innerHTML = "&#8681; Download All Trails (PDF)";
    downloadAllPdfBtn.addEventListener("click", async () => {
      const original = downloadAllPdfBtn.innerHTML;
      downloadAllPdfBtn.disabled = true;
      downloadAllPdfBtn.innerHTML = "Generating\u2026 this can take a minute";
      try {
        await downloadAllTracksPDF();
      } finally {
        downloadAllPdfBtn.disabled = false;
        downloadAllPdfBtn.innerHTML = original;
      }
    });
    body.appendChild(downloadAllPdfBtn);

    tracks.forEach(t => {
      const row = document.createElement("div");
      row.className = "track-row";
      const hike = estimateHike(t);
      row.dataset.difficulty = hike.difficulty;
      row.innerHTML = `
        <input type="checkbox" id="chk-${t.id}" style="margin-right:6px;">
        <span class="track-swatch" style="background:${t.color}"></span>
        <span class="track-label">${t.name}
          <div class="track-stats">
            <span class="diff-badge" style="background:${hike.color}22; color:${hike.color};">${hike.difficulty}</span>
            ~${hike.duration} &middot; ${t.length_km} km, ${t.min_ele}–${t.max_ele} m
          </div>
        </span>
        <button type="button" class="gpx-download-btn" title="Download this trail as GPX">&#8681;</button>
        <button type="button" class="gpx-download-btn pdf-download-btn" title="Download this trail as PDF">PDF</button>`;
      const checkbox = row.querySelector("input");
      checkbox.addEventListener("click", (e) => e.stopPropagation());
      checkbox.addEventListener("change", (e) => setTrackVisible(t.id, e.target.checked));
      const gpxBtn = row.querySelector(".gpx-download-btn:not(.pdf-download-btn)");
      gpxBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        downloadTrackGPX(t);
      });
      const pdfBtn = row.querySelector(".pdf-download-btn");
      pdfBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const original = pdfBtn.textContent;
        pdfBtn.disabled = true;
        pdfBtn.textContent = "\u2026";
        try {
          await downloadTrackPDF(t);
        } finally {
          pdfBtn.disabled = false;
          pdfBtn.textContent = original;
        }
      });
      row.addEventListener("click", () => {
        if (!checkbox.checked) { checkbox.checked = true; setTrackVisible(t.id, true); }
        const m = trackMarkers[t.id];
        const lngLat = m.start.getLngLat();
        map.flyTo({ center: lngLat, zoom: 15, pitch: 60, duration: 1000 });
        setTimeout(() => m.start.togglePopup(), 1050);
      });
      body.appendChild(row);
    });
  }

  function applyDifficultyFilter() {
    document.querySelectorAll("#track-panel-body .track-row").forEach(row => {
      row.style.display = activeDifficulties.has(row.dataset.difficulty) ? "flex" : "none";
    });
  }

  // ---- Waypoints ----
  function addWaypoints() {
    waypoints.forEach(w => {
      const el = document.createElement("div");
      el.className = "wp-marker";
      el.style.background = wpColors[w.type] || "#555";
      const wpDirections = w.type === "village"
        ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${w.coords[0]},${w.coords[1]}" target="_blank" rel="noopener" class="directions-link">Get directions &rarr;</a>`
        : "";
      new maplibregl.Marker({ element: el })
        .setLngLat([w.coords[1], w.coords[0]])
        .setPopup(new maplibregl.Popup().setHTML(`
          <div class="popup-title">${w.name}</div>
          <div class="popup-elev">Elevation: ${w.elevation}</div>
          ${wpDirections}
        `))
        .addTo(map);
    });
  }

  const serviceStyles = {
    shop:       { color: "#dd6b20", emoji: "🛒" },
    info:       { color: "#3182ce", emoji: "ℹ️" },
    lodging:    { color: "#805ad5", emoji: "🏨" },
    attraction: { color: "#38a169", emoji: "🌟" },
    transport:  { color: "#e53e3e", emoji: "🚌" }
  };

  function addServices() {
    services.forEach(s => {
      const style = serviceStyles[s.type] || { color: "#555", emoji: "📍" };
      const el = document.createElement("div");
      el.className = "service-marker";
      el.style.background = style.color;
      el.textContent = style.emoji;
      new maplibregl.Marker({ element: el })
        .setLngLat([s.coords[1], s.coords[0]])
        .setPopup(new maplibregl.Popup().setHTML(`
          ${s.image ? `<img src="${s.image}" class="popup-photo" alt="${s.name}">` : ""}
          <div class="popup-title">${s.name}</div>
          <div class="popup-desc">${s.desc}</div>
        `))
        .addTo(map);
    });
  }

  // ---- Collapsible panels ----
  function wireToggle(headerId, panelId) {
    document.getElementById(headerId).addEventListener("click", () => {
      document.getElementById(panelId).classList.toggle("collapsed");
    });
  }
  wireToggle("base-panel-toggle", "base-panel");
  wireToggle("track-panel-toggle", "track-panel");
  wireToggle("wp-legend-toggle", "wp-legend");
  wireToggle("weather-panel-toggle", "weather-panel");
  ["base-panel", "track-panel", "wp-legend", "weather-panel"].forEach(id => {
    document.getElementById(id).classList.add("collapsed");
  });

  // ---- Place / address search (OpenStreetMap Nominatim) ----
  (function setupSearch() {
    const container = document.getElementById("search-control");
    const input = document.getElementById("search-input");
    const clearBtn = document.getElementById("search-clear-btn");
    const resultsEl = document.getElementById("search-results");

    let debounceTimer = null;
    let abortCtrl = null;
    let currentResults = [];
    let highlightedIndex = -1;
    let searchMarker = null;

    const setResultsHtml = (html) => {
      resultsEl.innerHTML = html;
      container.classList.add("show-results");
    };

    const closeResults = () => {
      container.classList.remove("show-results");
      highlightedIndex = -1;
    };

    const renderResults = (results) => {
      currentResults = results;
      if (!results.length) {
        setResultsHtml(`<div class="search-status">No matches found.</div>`);
        return;
      }
      resultsEl.innerHTML = results.map((r, i) => {
        const parts = r.display_name.split(",");
        const main = parts[0].trim();
        const sub = parts.slice(1).join(",").trim();
        return `<div class="search-result-row" data-index="${i}">
          <div class="search-result-main">${main}</div>
          ${sub ? `<div class="search-result-sub">${sub}</div>` : ""}
        </div>`;
      }).join("");
      container.classList.add("show-results");
    };

    const selectResult = (r) => {
      input.value = r.display_name.split(",")[0].trim();
      container.classList.add("has-text");
      closeResults();
      const lat = parseFloat(r.lat), lon = parseFloat(r.lon);
      if (searchMarker) searchMarker.remove();
      searchMarker = new maplibregl.Marker({ color: "#c53030" })
        .setLngLat([lon, lat])
        .setPopup(new maplibregl.Popup().setHTML(`<div class="popup-title">${r.display_name.split(",")[0].trim()}</div>`))
        .addTo(map);
      if (r.boundingbox) {
        const bb = r.boundingbox.map(Number);
        map.fitBounds([[bb[2], bb[0]], [bb[3], bb[1]]], { padding: 60, maxZoom: 16, duration: 1000 });
      } else {
        map.flyTo({ center: [lon, lat], zoom: 15, pitch: 55, duration: 1000 });
      }
      searchMarker.togglePopup();
      input.blur();
    };

    const runSearch = (q) => {
      if (abortCtrl) abortCtrl.abort();
      abortCtrl = new AbortController();
      setResultsHtml(`<div class="search-status">Searching…</div>`);
      const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=0&limit=6&q=" +
        encodeURIComponent(q);
      fetch(url, { signal: abortCtrl.signal, headers: { "Accept-Language": navigator.language || "en" } })
        .then(r => r.json())
        .then(data => renderResults(data || []))
        .catch(err => {
          if (err.name === "AbortError") return;
          setResultsHtml(`<div class="search-status">Search unavailable right now.</div>`);
        });
    };

    input.addEventListener("input", () => {
      container.classList.toggle("has-text", !!input.value);
      clearTimeout(debounceTimer);
      const q = input.value.trim();
      if (q.length < 3) { closeResults(); return; }
      debounceTimer = setTimeout(() => runSearch(q), 400);
    });

    input.addEventListener("keydown", (e) => {
      const rows = () => resultsEl.querySelectorAll(".search-result-row");
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const list = rows();
        if (!list.length) return;
        highlightedIndex = e.key === "ArrowDown"
          ? Math.min(highlightedIndex + 1, list.length - 1)
          : Math.max(highlightedIndex - 1, 0);
        list.forEach((el, i) => el.classList.toggle("highlighted", i === highlightedIndex));
        list[highlightedIndex].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (highlightedIndex >= 0 && currentResults[highlightedIndex]) {
          selectResult(currentResults[highlightedIndex]);
        } else if (currentResults.length) {
          selectResult(currentResults[0]);
        } else {
          const q = input.value.trim();
          if (q.length >= 3) runSearch(q);
        }
      } else if (e.key === "Escape") {
        closeResults();
        input.blur();
      }
    });

    resultsEl.addEventListener("click", (e) => {
      const row = e.target.closest(".search-result-row");
      if (!row) return;
      const idx = parseInt(row.dataset.index, 10);
      if (currentResults[idx]) selectResult(currentResults[idx]);
    });

    clearBtn.addEventListener("click", () => {
      input.value = "";
      container.classList.remove("has-text");
      closeResults();
      if (searchMarker) { searchMarker.remove(); searchMarker = null; }
      input.focus();
    });
  })();

  // ---- Zoom controls ----
  document.getElementById("btn-zoom-in").addEventListener("click", () => {
    map.easeTo({ zoom: Math.min(map.getMaxZoom(), map.getZoom() + 1), duration: 300 });
  });
  document.getElementById("btn-zoom-out").addEventListener("click", () => {
    map.easeTo({ zoom: Math.max(map.getMinZoom(), map.getZoom() - 1), duration: 300 });
  });

  // ---- Tilt / rotate controls ----
  document.getElementById("btn-tilt-up").addEventListener("click", () => {
    map.easeTo({ pitch: Math.min(MAX_PITCH, map.getPitch() + 15), duration: 300 });
  });
  document.getElementById("btn-tilt-down").addEventListener("click", () => {
    map.easeTo({ pitch: Math.max(0, map.getPitch() - 15), duration: 300 });
  });
  document.getElementById("btn-rotate-left").addEventListener("click", () => {
    map.easeTo({ bearing: map.getBearing() - 30, duration: 300 });
  });
  document.getElementById("btn-rotate-right").addEventListener("click", () => {
    map.easeTo({ bearing: map.getBearing() + 30, duration: 300 });
  });
  document.getElementById("btn-north-flat").addEventListener("click", () => {
    map.easeTo({ pitch: 0, bearing: 0, duration: 500 });
  });

  // ---- Reset view ----
  document.getElementById("btn-reset").addEventListener("click", () => {
    if (initialCamera) map.flyTo({ ...initialCamera, duration: 900 });
  });

  // ---- Locate me ----
  let userMarker = null;
  document.getElementById("btn-open-new-tab").addEventListener("click", () => {
    window.open(window.location.href, "_blank");
  });

  document.getElementById("btn-locate").addEventListener("click", (e) => {
    const btn = e.currentTarget;
    if (!navigator.geolocation) { alert("Geolocation is not supported by this browser."); return; }
    btn.classList.add("nav-btn-loading");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        btn.classList.remove("nav-btn-loading");
        const { latitude, longitude } = pos.coords;
        if (userMarker) userMarker.remove();
        const el = document.createElement("div");
        el.className = "user-marker";
        userMarker = new maplibregl.Marker({ element: el })
          .setLngLat([longitude, latitude])
          .setPopup(new maplibregl.Popup().setText("You are here"))
          .addTo(map);
        map.flyTo({ center: [longitude, latitude], zoom: 14, pitch: 55, duration: 900 });
        userMarker.togglePopup();
      },
      (err) => {
        btn.classList.remove("nav-btn-loading");
        const blockedByIframe = /permissions policy|permissions-policy/i.test(err.message || "");
        if (blockedByIframe) {
          // This happens when the site embedding this map (e.g. a Wix iframe)
          // doesn't grant the "geolocation" permission down to this page —
          // the browser blocks the request before the user even sees a
          // prompt. Opening this map as its own top-level tab always works,
          // since there's no parent frame permission to be blocked by.
          const openInNewTab = confirm(
            "Location access is blocked inside this embedded map (the website hosting it hasn't enabled location permission for embedded content).\n\n" +
            "Open the map in its own browser tab to use your location there?"
          );
          if (openInNewTab) window.open(window.location.href, "_blank");
        } else {
          alert("Couldn't determine your location: " + err.message);
        }
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  // ---- Fullscreen ----
  let preFullscreenScroll = null;
  document.getElementById("btn-exit-fullscreen").addEventListener("click", () => {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  });
  document.getElementById("btn-fullscreen").addEventListener("click", () => {
    const mapEl = document.getElementById("app-root");
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;

    if (isFs) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
      return;
    }

    // Remember exactly where the page was scrolled to, so exiting
    // fullscreen can put the page back rather than leaving it jumped
    // to wherever the browser happened to land after the transition.
    preFullscreenScroll = { x: window.scrollX, y: window.scrollY };

    // iOS Safari doesn't support the Fullscreen API on arbitrary elements at
    // all (only <video>), and an iframe embed (e.g. Wix without the
    // "allowfullscreen" attribute) commonly blocks it too. Detect both cases
    // up front and fall back to opening this map in its own full browser tab,
    // which always works regardless of platform or iframe permissions.
    const fsSupported = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    if (!fsSupported) {
      window.open(window.location.href, "_blank");
      return;
    }

    const req = mapEl.requestFullscreen || mapEl.webkitRequestFullscreen;
    if (!req) {
      window.open(window.location.href, "_blank");
      return;
    }
    const result = req.call(mapEl);
    if (result && typeof result.catch === "function") {
      result.catch(() => {
        window.open(window.location.href, "_blank");
      });
    }
  });
  function syncFullscreenClass() {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    document.getElementById("app-root").classList.toggle("is-fullscreen", !!isFs);
    setTimeout(() => map.resize(), 100);
    if (!isFs && preFullscreenScroll) {
      window.scrollTo(preFullscreenScroll.x, preFullscreenScroll.y);
      preFullscreenScroll = null;
    }
  }
  document.addEventListener("fullscreenchange", syncFullscreenClass);
  document.addEventListener("webkitfullscreenchange", syncFullscreenClass);

  // ---- Weather widget (Open-Meteo — free, no API key, CORS-enabled) ----
  function wmoIcon(code) {
    if (code === 0) return "☀️";
    if (code === 1 || code === 2) return "🌤️";
    if (code === 3) return "☁️";
    if (code === 45 || code === 48) return "🌫️";
    if ([51, 53, 55, 56, 57].includes(code)) return "🌦️";
    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "🌧️";
    if ([71, 73, 75, 77, 85, 86].includes(code)) return "🌨️";
    if ([95, 96, 99].includes(code)) return "⛈️";
    return "🌡️";
  }
  function wmoText(code) {
    const map = {
      0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy",
      45: "Fog", 48: "Fog",
      51: "Light drizzle", 53: "Drizzle", 55: "Drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle",
      61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain",
      71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
      80: "Rain showers", 81: "Rain showers", 82: "Violent showers",
      85: "Snow showers", 86: "Snow showers",
      95: "Thunderstorm", 96: "Thunderstorm", 99: "Thunderstorm"
    };
    return map[code] || "—";
  }

  const weatherUrl = "https://api.open-meteo.com/v1/forecast" +
    "?latitude=42.4538&longitude=19.8749" +
    "&current_weather=true" +
    "&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max" +
    "&timezone=auto&forecast_days=3";

  fetch(weatherUrl)
    .then(r => r.json())
    .then(data => {
      const body = document.getElementById("weather-panel-body");
      const cur = data.current_weather;
      const days = data.daily;

      let html = `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
          <span style="font-size:26px;">${wmoIcon(cur.weathercode)}</span>
          <div>
            <div style="font-size:18px; font-weight:700;">${Math.round(cur.temperature)}°C</div>
            <div style="font-size:11px; color:#666;">${wmoText(cur.weathercode)}</div>
          </div>
        </div>
        <div style="display:flex; gap:10px;">`;

      for (let i = 0; i < 3; i++) {
        const date = new Date(days.time[i]);
        const label = i === 0 ? "Today" : date.toLocaleDateString(undefined, { weekday: "short" });
        html += `
          <div style="text-align:center; flex:1;">
            <div style="font-size:10px; color:#888; margin-bottom:2px;">${label}</div>
            <div style="font-size:16px;">${wmoIcon(days.weathercode[i])}</div>
            <div style="font-size:11px; font-weight:600;">${Math.round(days.temperature_2m_max[i])}°</div>
            <div style="font-size:10px; color:#888;">${Math.round(days.temperature_2m_min[i])}°</div>
            <div style="font-size:9px; color:#4299e1; margin-top:2px;">${days.precipitation_probability_max[i]}%</div>
          </div>`;
      }
      html += `</div>`;
      body.innerHTML = html;
    })
    .catch(() => {
      document.getElementById("weather-panel-body").innerHTML =
        `<div style="font-size:11px; color:#888;">Weather unavailable right now.</div>`;
    });
</script>
